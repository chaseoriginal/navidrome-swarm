services:
  navidrome:
    image: deluan/navidrome:latest
    user: 1000:1000
    ports:
    - target: 4533
      published: 4533
      protocol: tcp
      mode: host
    deploy:
      placement:
        constraints:
        - node.labels.deployment.target.subsonic == true
      restart_policy:
        condition: on-failure
    environment:
      ND_ENABLEINSIGHTSCOLLECTOR: 'false'
    volumes:
    - navidrome-swarm_nd-swarm:/data
    - /media/Multimedia/Music:/music:ro
volumes:
  navidrome-swarm_nd-swarm:
    name: navidrome-swarm_nd-swarm
